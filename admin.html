<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sample admin</title>
<style>
  body { margin: 0; background: #f3f4f1; color: #1c2321; font: 15px/1.5 Arial, sans-serif; }
  main { max-width: 1900px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .bar { position: sticky; top: 0; background: #f3f4f1; padding: 12px 0; display: flex; flex-wrap: wrap;
         gap: 10px; align-items: center; border-bottom: 1px solid #d3d7d1; z-index: 2; }
  input[type=password] { padding: 8px; border: 1px solid #d3d7d1; border-radius: 6px; }
  button { padding: 8px 14px; border: 0; border-radius: 6px; background: #ddd; cursor: pointer; font: inherit; }
  button.danger { background: #b3261e; color: #fff; font-weight: 600; }
  #msg { color: #5d6762; }
  .wrap { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; margin-top: 16px; align-items: start; }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; }
  .card.viewing { border-color: #f2b705; }
  .preview { position: sticky; top: 70px; background: #fff; border: 1px solid #d3d7d1; border-radius: 10px; padding: 12px; }
  .preview h2 { font-size: 1rem; margin: 0 0 8px; word-break: break-all; }
  .preview canvas { display: block; max-width: 100%; max-height: 75vh; width: auto; height: auto; margin: 0 auto; border-radius: 6px; }
  #pstatus { color: #5d6762; margin: 8px 0 0; }
  .card { background: #fff; border: 2px solid #d3d7d1; border-radius: 8px; overflow: hidden; }
  .card.marked { border-color: #b3261e; opacity: 0.6; }
  .card img { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; cursor: zoom-in; }
  .card label { display: flex; gap: 6px; padding: 6px 8px; font-size: 0.8rem; cursor: pointer;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .pager { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 20px; }
  .pager button { background: #fff; border: 1px solid #d3d7d1; }
  .pager button:hover:not(:disabled) { border-color: #1c2321; }
  .pager[hidden] { display: none; }
  .pager .nums { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; flex: 1; }
  .pager .nums button { min-width: 30px; padding: 6px 8px; }
  .pager .nums .dots { align-self: center; padding: 0 2px; }
  .pager .nums button.current { background: #1c2321; border-color: #1c2321; color: #fff; font-weight: 700; }
  .pager button:disabled { opacity: 0.4; cursor: default; }

  @media (max-width: 1100px) { .wrap { grid-template-columns: 1fr; } .preview { position: static; } .grid { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 700px)  { .grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<main>
  <h1>Sample admin</h1>
  <p>Click a photo to see what the AI finds. Tick it and press Delete to remove it. Deleted photos go to a <b>trash</b> folder on the server. Ticks are kept while you move between pages.</p>
  <div class="bar">
    <input type="password" id="pw" placeholder="Admin password">
    <button type="button" id="none">Clear ticks</button>
    <button type="button" class="danger" id="del">Delete ticked</button>
    <span id="msg"></span>
  </div>
  <div class="wrap">
    <div>
      <div class="grid" id="grid"></div>
      <div class="pager" id="pager" hidden>
        <button type="button" id="prev">‹ Previous</button>
        <span class="nums" id="pageNums"></span>
        <button type="button" id="next">Next ›</button>
      </div>
    </div>
    <div class="preview">
      <h2 id="ptitle">Click a photo to check it</h2>
      <canvas id="canvas" width="10" height="10"></canvas>
      <p id="pstatus"></p>
    </div>
  </div>
</main>
<script>
  const LIST_URL   = "/api/samples";
  const DETECT_URL = "/api/samples/detect/";   // checks once, then reuses the saved answer
  const DELETE_URL = "/api/samples/delete";
  const IMG_DIR    = "/roboflow/images/";
  const PER_PAGE   = 40;                    // 8 wide x 5 rows
  const MIN_CONF   = 0.5;
  const MAX_SIDE   = 1280;
  const PALETTE = ["#c6ff00", "#00e5ff", "#ff2bd6", "#ff9100", "#7c4dff", "#00e676", "#ff5252", "#ffd600", "#40c4ff", "#e040fb"];

  const $ = (id) => document.getElementById(id);
  const grid = $("grid"), msg = $("msg"), canvas = $("canvas"), ctx = canvas.getContext("2d");
  let allNames = [], page = 0, viewingName = null;

  function colorFor(name) {
    let h = 0;
    for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return PALETTE[h % PALETTE.length];
  }
  const ticked = new Set();                 // remembered across pages

  const count = () => { msg.textContent = ticked.size + " ticked"; };

  async function load() {
    const names = await (await fetch(LIST_URL)).json();
    allNames = names;
    for (const n of [...ticked]) if (!names.includes(n)) ticked.delete(n);
    msg.textContent = names.length + " samples";
    showPage(page);
  }

  function showPage(n) {
    const pages = Math.max(1, Math.ceil(allNames.length / PER_PAGE));
    page = Math.max(0, Math.min(n, pages - 1));
    grid.innerHTML = "";
    allNames.slice(page * PER_PAGE, (page + 1) * PER_PAGE).forEach((name) => {
      const card = document.createElement("div");
      card.className = "card" + (ticked.has(name) ? " marked" : "") + (name === viewingName ? " viewing" : "");
      const img = document.createElement("img");
      img.src = IMG_DIR + encodeURIComponent(name);
      img.loading = "lazy";
      img.alt = name;
      img.title = name;
      img.addEventListener("click", () => preview(name, card));
      const label = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.value = name;
      cb.checked = ticked.has(name);
      cb.addEventListener("change", () => {
        if (cb.checked) ticked.add(name); else ticked.delete(name);
        card.classList.toggle("marked", cb.checked);
        count();
      });
      label.append(cb, document.createTextNode(name));
      card.append(img, label);
      grid.appendChild(card);
    });

    $("pager").hidden = pages < 2;
    const nums = $("pageNums");
    nums.innerHTML = "";
    const keep = new Set([0, pages - 1, page - 1, page, page + 1]);
    if (page <= 3) { for (let i = 2; i <= 5; i++) keep.add(i); }
    if (page >= pages - 4) { for (let i = 3; i <= 6; i++) keep.add(pages - i); }
    const shown = [...keep].filter((i) => i >= 0 && i < pages).sort((a, b) => a - b);
    let last = -1;
    shown.forEach((i) => {
      if (i - last > 1) {
        const dots = document.createElement("span");
        dots.textContent = "…";
        dots.className = "dots";
        nums.appendChild(dots);
      }
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = i + 1;
      b.setAttribute("aria-label", `Page ${i + 1}`);
      if (i === page) { b.classList.add("current"); b.setAttribute("aria-current", "page"); }
      b.addEventListener("click", () => showPage(i));
      nums.appendChild(b);
      last = i;
    });
    $("prev").disabled = page === 0;
    $("next").disabled = page >= pages - 1;
  }

  async function preview(name, card) {
    grid.querySelectorAll(".viewing").forEach((c) => c.classList.remove("viewing"));
    card.classList.add("viewing");
    viewingName = name;
    $("ptitle").textContent = name;
    $("pstatus").textContent = "Checking…";
    try {
      const img = new Image();
      img.src = IMG_DIR + encodeURIComponent(name);
      await img.decode();
      const s = Math.min(1, MAX_SIDE / Math.max(img.width, img.height));
      canvas.width = Math.round(img.width * s);
      canvas.height = Math.round(img.height * s);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      const res = await fetch(DETECT_URL + encodeURIComponent(name));
      if (!res.ok) throw new Error(`Check failed (${res.status})`);
      const data = await res.json();
      if (viewingName !== name) return;          // clicked something else meanwhile
      const k = data.image && data.image.width ? canvas.width / data.image.width : 1;
      const preds = (data.predictions || []).filter((p) => p.confidence >= MIN_CONF);

      const fs = Math.max(10, canvas.width / 60);
      ctx.lineWidth = Math.max(1.5, canvas.width / 600);
      ctx.font = `600 ${fs}px Arial`;
      ctx.textBaseline = "top";
      preds.forEach((p) => {
        const c = colorFor(p.class);
        const x = (p.x - p.width / 2) * k, y = (p.y - p.height / 2) * k;
        ctx.strokeStyle = c;
        ctx.strokeRect(x, y, p.width * k, p.height * k);
        const label = `${p.class} ${Math.round(p.confidence * 100)}%`;
        const h = fs * 1.3, w = ctx.measureText(label).width + 6, ly = y - h < 0 ? y : y - h;
        ctx.fillStyle = c; ctx.fillRect(x, ly, w, h);
        ctx.fillStyle = "#000"; ctx.fillText(label, x + 3, ly + (h - fs) / 2);
      });
      $("pstatus").textContent = preds.length ? `Found ${preds.length}.` : "Nothing detected.";
    } catch (err) {
      $("pstatus").textContent = err.message;
    }
  }

  $("prev").addEventListener("click", () => showPage(page - 1));
  $("next").addEventListener("click", () => showPage(page + 1));

  $("none").onclick = () => { ticked.clear(); showPage(page); count(); };

  $("del").onclick = async () => {
    const files = [...ticked];
    if (!files.length) { msg.textContent = "Nothing ticked."; return; }
    if (!confirm(`Move ${files.length} photo(s) to trash?`)) return;
    const res = await fetch(DELETE_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: $("pw").value, files }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { msg.textContent = data.error || `Failed (${res.status})`; return; }
    data.moved.forEach((n) => ticked.delete(n));
    await load();
    msg.textContent = `Moved ${data.moved.length} to trash.`;
  };

  load();
</script>
</body>
</html>
